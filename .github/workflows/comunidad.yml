# Bot de comunidad: cada hora contesta comentarios y, 12-24 h después de cada test, publica la solución
# (Instagram, TikTok y YouTube). Ver comunidad.py. Se apaga con la variable COMUNIDAD = false.
name: Comunidad

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo enseñar lo que haría (no publica nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: comunidad
  cancel-in-progress: false

jobs:
  comunidad:
    if: vars.ACTIVO == 'true' && vars.COMUNIDAD != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: timeout 300 pip install --prefer-binary --timeout 20 -q requests
      - name: Contestar comentarios y publicar soluciones
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZERNIO_MATCH: ${{ vars.ZERNIO_MATCH || 'arquitecturaconfidencial' }}
          ZERNIO_IG_ACCOUNT: ${{ vars.ZERNIO_IG_ACCOUNT }}
          ZERNIO_TT_ACCOUNT: ${{ vars.ZERNIO_TT_ACCOUNT }}
          ZERNIO_YT_ACCOUNT: ${{ vars.ZERNIO_YT_ACCOUNT }}
          IG_HANDLE: ${{ vars.IG_HANDLE || '@arquitecturaconfidencial' }}
          COMUNIDAD_DEBUG: ${{ inputs.prueba && '1' || '' }}
        run: python comunidad.py ${{ inputs.prueba && '--prueba' || '' }} | tee comunidad.log
      - name: Guardar el estado
        if: always() && !inputs.prueba
        run: python sincronizar.py "Comunidad $(date +%F-%H)" comunidad.json comunidad_estado.md comunidad.log
